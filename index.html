<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>釜山五天四夜 · 自由行互動規劃 2026</title>
<style>
/* ===================================================================
   釜山自由行互動規劃 — 樣式
   配色取海景日落感：珊瑚橘 + 海洋藍綠 + 沙灘米
   =================================================================== */
:root{
  --coral:#ff6b5e; --coral-d:#e8554a;
  --teal:#13a4a4; --teal-d:#0e8585;
  --navy:#1f3a5f; --ink:#2b2f36; --muted:#6b7280;
  --sand:#fff8f1; --card:#ffffff; --line:#ece6dd;
  --gold:#f4a83a; --green:#23a06b; --red:#e5484d;
  --shadow:0 6px 22px rgba(31,58,95,.10);
  --shadow-lg:0 14px 40px rgba(31,58,95,.18);
  /* 預算六大類顏色（圓環圖共用） */
  --c-stay:#3b82c4; --c-food:#ff6b5e; --c-play:#13a4a4;
  --c-shop:#f4a83a; --c-trans:#8b6bd6; --c-reserve:#9aa3ad;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  color:var(--ink); background:var(--sand); line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{line-height:1.3}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:var(--teal-d)}
.hidden{display:none !important}

/* ---- 頂部標題列 ---- */
header.topbar{
  background:linear-gradient(120deg,#1f3a5f 0%,#13a4a4 55%,#ff6b5e 130%);
  color:#fff; padding:18px 22px; box-shadow:var(--shadow); position:sticky; top:0; z-index:40;
}
.topbar-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.topbar .sub{font-size:12.5px;opacity:.92;font-weight:500}
.topbar .spacer{flex:1}
.topbar .nav-btn{
  background:rgba(255,255,255,.16);color:#fff;padding:7px 13px;border-radius:10px;font-size:13px;
  font-weight:600;backdrop-filter:blur(4px);transition:.15s;
}
.topbar .nav-btn:hover{background:rgba(255,255,255,.30)}

main{max-width:1180px;margin:0 auto;padding:26px 18px 80px}

/* ---- 區塊標題 ---- */
.section-h{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.section-h h2{font-size:21px;font-weight:800;color:var(--navy)}
.section-h .pill{font-size:12px;background:#fff;border:1px solid var(--line);padding:3px 10px;border-radius:999px;color:var(--muted)}

/* ===================== 首頁 ===================== */
.hero{
  background:var(--card);border-radius:22px;padding:30px 28px;box-shadow:var(--shadow);
  border:1px solid var(--line);margin-bottom:24px;position:relative;overflow:hidden;
}
.hero::after{content:"🌊";position:absolute;right:-10px;bottom:-22px;font-size:120px;opacity:.06}
.hero .tag{display:inline-block;background:linear-gradient(90deg,var(--coral),var(--gold));color:#fff;
  font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;margin-bottom:12px}
.hero h2{font-size:30px;font-weight:900;color:var(--navy);margin-bottom:8px}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:10px}
.hero .meta b{color:var(--ink)}
.priority{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.priority span{font-size:12.5px;background:var(--sand);border:1px solid var(--line);padding:5px 11px;border-radius:8px}

.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:6px}
.mode-card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;cursor:pointer;
  transition:.2s;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.mode-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--teal)}
.mode-card .num{font-size:13px;font-weight:800;color:var(--coral);letter-spacing:1px}
.mode-card .emoji{font-size:40px;margin:6px 0 10px}
.mode-card h3{font-size:21px;font-weight:800;color:var(--navy);margin-bottom:8px}
.mode-card p{font-size:14px;color:var(--muted);min-height:66px}
.mode-card .go{margin-top:14px;display:inline-flex;align-items:center;gap:6px;color:var(--teal-d);font-weight:700;font-size:14px}
.mode-card.m1{background:linear-gradient(160deg,#fff,#fff6f4)}
.mode-card.m2{background:linear-gradient(160deg,#fff,#f1fbfb)}

.resume-bar{background:#fffbe9;border:1px solid #f3e2a8;border-radius:14px;padding:14px 18px;margin-bottom:20px;
  display:flex;align-items:center;gap:12px;font-size:14px}
.resume-bar b{color:var(--navy)}

/* ===================== 通用按鈕 ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;border-radius:12px;
  padding:11px 20px;font-size:14.5px;transition:.15s;white-space:nowrap}
.btn-primary{background:linear-gradient(90deg,var(--coral),var(--coral-d));color:#fff;box-shadow:0 4px 14px rgba(232,85,74,.35)}
.btn-primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn-teal{background:linear-gradient(90deg,var(--teal),var(--teal-d));color:#fff;box-shadow:0 4px 14px rgba(14,133,133,.3)}
.btn-teal:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal-d)}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:9px}

/* ===================== 預算選擇（模式1） ===================== */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow);margin-bottom:22px}
.budget-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.preset{border:2px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.15s;text-align:center;background:#fff}
.preset:hover{border-color:var(--teal)}
.preset.active{border-color:var(--coral);background:#fff6f4;box-shadow:0 4px 14px rgba(232,85,74,.18)}
.preset .lvl{font-size:15px;font-weight:800;color:var(--navy)}
.preset .amt{font-size:22px;font-weight:900;color:var(--coral);margin:6px 0}
.preset .desc{font-size:12.5px;color:var(--muted)}
.slider-wrap{margin-top:18px}
.slider-wrap label{font-size:14px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.slider-wrap label .val{font-size:24px;font-weight:900;color:var(--teal-d)}
input[type=range]{width:100%;height:8px;border-radius:8px;-webkit-appearance:none;
  background:linear-gradient(90deg,var(--teal),var(--coral));margin-top:12px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:#fff;border:3px solid var(--coral);box-shadow:var(--shadow);cursor:pointer}
.range-ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}

/* ===================== 自選清單（模式2） ===================== */
.select-head{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 22px;
  box-shadow:var(--shadow);margin-bottom:18px}
.select-head p{font-size:13.5px;color:var(--muted);margin-top:4px}
.cat-section{margin-bottom:22px}
.cat-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;user-select:none}
.cat-bar h3{font-size:18px;font-weight:800;color:var(--navy)}
.cat-bar .count{font-size:12.5px;background:var(--teal);color:#fff;padding:2px 9px;border-radius:999px;font-weight:700}
.cat-bar .chev{margin-left:auto;color:var(--muted);transition:.2s;font-size:13px}
.cat-bar.collapsed .chev{transform:rotate(-90deg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(252px,100%),1fr));gap:12px}
.place-card{
  border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff;transition:.15s;
  display:flex;flex-direction:column;gap:6px;position:relative;cursor:pointer;
}
.place-card:hover{border-color:var(--teal);box-shadow:var(--shadow)}
.place-card.checked{border-color:var(--coral);background:#fff6f4}
.place-card .pc-top{display:flex;align-items:flex-start;gap:8px}
.place-card .chk{width:21px;height:21px;border-radius:7px;border:2px solid #cfd4da;flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:.15s}
.place-card.checked .chk{background:var(--coral);border-color:var(--coral)}
.place-card .pc-name{font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.35}
.place-card .pc-kr{font-size:11.5px;color:var(--muted)}
.place-card .pc-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
.chip-area{background:#eef6ff;color:#3b6fa0}
.chip-price{background:#fff1e6;color:#c97b1e}
.chip-meal{background:#eafaf2;color:#1f8a5b}
.chip-sub{background:#f3f0fb;color:#6b54b8}
.stars{color:var(--gold);font-size:12px;letter-spacing:1px}
.place-card .pc-note{font-size:12px;color:var(--muted);line-height:1.4}
.place-card .pc-search{position:absolute;top:10px;right:10px;font-size:11px;color:var(--teal-d);
  background:#eafafa;padding:3px 8px;border-radius:8px;font-weight:600;opacity:0;transition:.15s}
.place-card:hover .pc-search{opacity:1}
.add-custom-card{border:2px dashed #cdd5dd;border-radius:14px;display:flex;align-items:center;justify-content:center;
  gap:8px;color:var(--teal-d);font-weight:700;font-size:14px;cursor:pointer;min-height:90px;background:#fbfdfd}
.add-custom-card:hover{border-color:var(--teal);background:#f1fbfb}

/* 底部固定操作列 */
.sticky-foot{position:sticky;bottom:0;background:rgba(255,248,241,.92);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:14px 18px;margin:0 -18px -80px;z-index:30;
  display:flex;align-items:center;gap:14px}
.sticky-foot .info{font-size:14px}
.sticky-foot .info b{color:var(--coral);font-size:18px}
.sticky-foot .spacer{flex:1}

/* ===================== 行程畫面 ===================== */
.summary-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;margin-bottom:24px}
@media(max-width:880px){.summary-grid{grid-template-columns:1fr}}
.budget-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.budget-card h3{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.donut-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:8px}
.legend{flex:1;min-width:180px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.legend-item .dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.legend-item .lg-name{flex:1}
.legend-item .lg-val{font-weight:700;color:var(--ink)}
.legend-item .lg-pct{color:var(--muted);font-size:11.5px;width:40px;text-align:right}

.target-box{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.target-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.target-row b{font-size:16px}
.progress{height:12px;background:#eee;border-radius:999px;overflow:hidden;margin:8px 0}
.progress span{display:block;height:100%;border-radius:999px;transition:.4s}
.verdict{font-size:13px;padding:10px 12px;border-radius:10px;margin-top:8px;line-height:1.5}
.verdict.under{background:#eafaf2;color:#1f7a52;border:1px solid #b8e6cf}
.verdict.ok{background:#eef6ff;color:#2a5d8f;border:1px solid #c2dcf5}
.verdict.over{background:#fdeceb;color:#bc3b3f;border:1px solid #f3c4c2}

.daily-bars{margin-top:6px}
.daily-bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.daily-bar .dlabel{width:54px;font-weight:700;color:var(--navy);flex-shrink:0}
.daily-bar .track{flex:1;height:22px;background:#f1ece4;border-radius:7px;overflow:hidden;position:relative}
.daily-bar .fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--coral));border-radius:7px;min-width:2px}
.daily-bar .dval{width:74px;text-align:right;font-weight:700;color:var(--ink);flex-shrink:0}

/* 行程時間軸 */
.itin-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.itin-toolbar .spacer{flex:1}
.day-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  margin-bottom:20px;overflow:hidden}
.day-head{background:linear-gradient(100deg,var(--navy),#2d5580);color:#fff;padding:15px 22px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.day-head .dnum{background:rgba(255,255,255,.18);width:42px;height:42px;border-radius:12px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1;flex-shrink:0}
.day-head .dnum small{font-size:9px;opacity:.8;font-weight:600}
.day-head .dtitle{font-size:16px;font-weight:800}
.day-head .ddate{font-size:12.5px;opacity:.9}
.day-head .dspend{margin-left:auto;font-size:13px;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:999px;font-weight:700}
.day-warn{background:#fff7e6;color:#a6701a;font-size:12.5px;padding:8px 22px;border-bottom:1px solid #f3e2a8;
  display:flex;align-items:center;gap:8px}
.day-warn button{color:var(--coral-d);font-weight:700;text-decoration:underline;font-size:12.5px}

.timeline{padding:8px 22px 18px}
.tl-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line);position:relative}
.tl-item:last-child{border-bottom:none}
.tl-time{width:52px;flex-shrink:0;font-weight:800;color:var(--teal-d);font-size:13.5px;padding-top:2px}
.tl-icon{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:17px;background:var(--sand)}
.tl-body{flex:1;min-width:0}
.tl-slot{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tl-name{font-size:15px;font-weight:700;color:var(--ink)}
.tl-name .kr{font-size:11.5px;color:var(--muted);font-weight:500}
.tl-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;align-items:center}
.tl-note{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.tl-actions{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0}
.icon-btn{width:28px;height:28px;border-radius:8px;background:var(--sand);color:var(--muted);font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:hover{background:#fdeceb;color:var(--red)}
.icon-btn.search:hover{background:#eafafa;color:var(--teal-d)}
.tl-marker{display:flex;gap:14px;padding:10px 0;align-items:center}
.tl-marker .tl-time{color:var(--navy)}
.tl-marker .mk{background:#eef6ff;color:#2a5d8f;border:1px dashed #aecbe8;border-radius:10px;padding:8px 14px;
  font-size:13px;font-weight:600;flex:1}
.autofill-tag{font-size:10px;background:#fff3cd;color:#9a6b00;padding:1px 7px;border-radius:6px;font-weight:700}
.day-foot{background:var(--sand);padding:12px 22px;display:flex;align-items:center;gap:10px;font-size:13.5px;border-top:1px solid var(--line)}
.day-foot .hbtn{margin-left:auto}
.add-slot{margin:6px 22px 16px;border:1.5px dashed #cdd5dd;border-radius:12px;padding:10px;text-align:center;
  color:var(--teal-d);font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s}
.add-slot:hover{border-color:var(--teal);background:#f1fbfb}

/* ===================== Modal ===================== */
.modal-bg{position:fixed;inset:0;background:rgba(31,58,95,.45);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#fff;z-index:2}
.modal-h h3{font-size:17px;font-weight:800;color:var(--navy)}
.modal-h .x{margin-left:auto;font-size:22px;color:var(--muted);width:32px;height:32px;border-radius:8px}
.modal-h .x:hover{background:var(--sand)}
.modal-b{padding:20px 22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:14px;font-family:inherit;background:#fff}
.field input:focus,.field select:focus{outline:none;border-color:var(--teal)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.search-links{display:flex;gap:8px;margin-top:6px}
.search-links a{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:9px;border-radius:9px;
  border:1.5px solid var(--line);text-decoration:none;color:var(--ink);transition:.15s}
.search-links a:hover{border-color:var(--teal);color:var(--teal-d);background:#f1fbfb}
.search-bar{display:flex;gap:8px}
.search-bar input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;background:#fff}
.search-bar input:focus{outline:none;border-color:var(--teal)}
.search-bar .btn{flex-shrink:0}
.link-btn{font-size:12px;color:var(--teal-d);font-weight:700}
.link-btn:hover{text-decoration:underline}
.keyrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--sand);padding:11px;border-radius:11px;margin-bottom:6px;border:1px solid var(--line)}
.keyrow input{flex:1;min-width:180px;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;background:#fff}
.keyrow input:focus{outline:none;border-color:var(--teal)}
.hint{font-size:12px;color:var(--muted);background:var(--sand);padding:9px 12px;border-radius:9px;margin-bottom:14px;line-height:1.5}

/* 行程內「新增地點」選擇清單 */
.pick-list{display:flex;flex-direction:column;gap:8px;max-height:48vh;overflow:auto}
.pick-item{border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;align-items:center;gap:10px;
  cursor:pointer;transition:.15s}
.pick-item:hover{border-color:var(--teal);background:#f1fbfb}
.pick-item .pi-name{font-weight:700;font-size:14px}
.pick-item .pi-go{margin-left:auto;color:var(--teal-d);font-weight:700;font-size:13px}
.pick-group-h{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 2px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);
  color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);
  z-index:200;opacity:0;transition:.3s}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* 觸控裝置（手機/平板）沒有 hover，把卡片上的快搜按鈕固定顯示 */
@media(hover:none){
  .place-card .pc-search{opacity:1}
}
@media(max-width:680px){
  main{padding:18px 14px 80px}
  .topbar{padding:14px 16px}
  .topbar h1{font-size:16px}
  .topbar .sub{display:none}               /* 日期在首頁卡片已有，手機列省空間 */
  .topbar .nav-btn{padding:6px 11px;font-size:12.5px}
  .mode-grid{grid-template-columns:1fr}
  .budget-presets{grid-template-columns:1fr}
  .hero{padding:24px 20px}
  .hero h2{font-size:23px}
  .field-row{grid-template-columns:1fr}
  /* 底部操作列：改為換行排版，主按鈕獨佔一行最好按 */
  .sticky-foot{flex-wrap:wrap;gap:8px;padding:12px 14px;margin:0 -14px -80px}
  .sticky-foot .info{flex-basis:100%}
  .sticky-foot .spacer{display:none}

// 名稱關鍵字分類（最強訊號，優先於 OSM/Google 的 class/type）
function guessCatByName(name){
  const n=(name||'').toLowerCase();
  const has=arr=>arr.some(k=>n.includes(k));
  if(has(['카페','커피','coffee','cafe','로스터','베이커리','bakery','디저트','dessert'])) return 'cafe';
  if(has(['호텔','hotel','모텔','motel','게스트','guest','호스텔','hostel','리조트','resort','레지던스'])) return 'stay';
  if(has(['국밥','갈비','식당','횟집','고기','구이','삼겹','곰탕','찌개','국수','냉면','밀면','칼국수','김밥','분식','치킨','피자','pizza','버거','burger','포차','해물','게장','대게','초밥','스시','라멘','우동','맛집','restaurant'])) return 'food';
  if(has(['시장','market','백화점','면세','마트','쇼핑','mall','다이소','daiso','올리브영','olive','이마트','신세계','롯데백화'])) return 'shop';
  if(has(['해수욕장','beach','용궁사','사찰','공원','park','전망대','타워','tower','대교','bridge','마을','village','스파','spa','찜질','sauna','루지','luge','박물관','museum','미술관','수족관','aquarium','케이블카','cable'])) return 'play';
  return null;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function guessArea(text){
  const t=(text||'').toLowerCase();
  for(const pair of AREA_KEYWORDS){ if(pair[1].some(k=>t.includes(k.toLowerCase()))) return pair[0]; }
  return 'any';
}
function guessCatOSM(cls,type){    // 由 OSM 的 class/type 推測類別（抓不到明確餐飲時，當作景點地標）
  if(cls==='tourism' && ['hotel','guest_house','motel','hostel','apartment','chalet'].includes(type)) return 'stay';
  if(type==='cafe' || type==='coffee_shop') return 'cafe';
  if(cls==='amenity' && ['restaurant','fast_food','food_court','pub','bar','bbq','ice_cream'].includes(type)) return 'food';
  if(cls==='shop' || ['mall','department_store','supermarket','marketplace','commercial','retail'].includes(type)) return 'shop';
  if(cls==='amenity' && ['place_of_worship','spa','public_bath','theatre','cinema','arts_centre'].includes(type)) return 'play';
  if(['tourism','leisure','historic','natural','man_made','waterway'].includes(cls)) return 'play';
  return 'play';
}
function guessCatGoogle(types){    // 由 Google 的 types 推測類別
  types=types||[];
  if(types.includes('lodging')) return 'stay';
  if(types.includes('cafe')||types.includes('bakery')) return 'cafe';
  if(types.includes('restaurant')||types.includes('food')||types.includes('meal_takeaway')||types.includes('meal_delivery')) return 'food';
  if(types.includes('department_store')||types.includes('shopping_mall')||types.includes('store')||types.includes('supermarket')||types.includes('clothing_store')) return 'shop';
  if(types.includes('tourist_attraction')||types.includes('spa')||types.includes('amusement_park')||types.includes('park')||types.includes('aquarium')||types.includes('museum')) return 'play';
  return 'food';
}
// OpenStreetMap Nominatim 搜尋（公開端點支援 CORS，免金鑰）
async function searchOSM(query){
  // 不硬加「釜山」字串（會過度限制名稱比對、特定店名常變 0 筆）；改用 countrycodes=kr + 釜山 viewbox 來偏好排序
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&namedetails=1&limit=10'
    +'&countrycodes=kr&accept-language=ko,zh-TW,zh,en&bounded=0&viewbox='+encodeURIComponent(BUSAN_VIEWBOX)
    +'&q='+encodeURIComponent(query);
  const res=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!res.ok) throw new Error('OSM '+res.status);
  const data=await res.json();
  return data.map(d=>{
    const nd=d.namedetails||{};
    const nm = nd['name:zh']||nd['name:zh-Hant']||nd.int_name||nd.name||d.name||(d.display_name||'').split(',')[0];
    return {
      name:nm,
      address:(d.display_name||'').split(',').slice(0,4).join('，'),
      cat:guessCatByName(nm) || guessCatOSM(d.class,d.type), rating:null, priceLevel:null,
      area:guessArea(d.display_name+' '+JSON.stringify(nd)), provider:'OpenStreetMap'
    };
  });
}
// 動態載入 Google 地圖 JS SDK（用 SDK 走瀏覽器，避免 REST 的 CORS 問題）
function loadGoogleMaps(key){
  if(window.google && window.google.maps && window.google.maps.places) return Promise.resolve();
  if(_gmapsLoading) return _gmapsLoading;
  _gmapsLoading=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&libraries=places&language=zh-TW&region=KR';
    s.async=true; s.onload=()=>resolve(); s.onerror=()=>{ _gmapsLoading=null; reject(new Error('load fail')); };
    document.head.appendChild(s);
  });
  return _gmapsLoading;
}
function googleTextSearch(query){
  return new Promise(resolve=>{
    try{
      const svc=new google.maps.places.PlacesService(document.createElement('div'));
      svc.textSearch({query:query+' 釜山', location:new google.maps.LatLng(35.16,129.10), radius:35000}, (results,status)=>{
        if(status!=='OK' || !results){ resolve([]); return; }
        resolve(results.slice(0,8).map(r=>({
          name:r.name, address:r.formatted_address||'',
          cat:guessCatByName(r.name) || guessCatGoogle(r.types), rating:r.rating||null,
          priceLevel:(typeof r.price_level==='number'?r.price_level:null),
          area:guessArea((r.formatted_address||'')+' '+r.name), provider:'Google'
        })));
      });
    }catch(e){ resolve([]); }
  });
}
// 搜尋分流：有金鑰先試 Google，失敗或無結果則退回免費 OSM
async function searchPlaces(query){
  if(state.apiKey){
    try{ await loadGoogleMaps(state.apiKey); const g=await googleTextSearch(query); if(g.length) return g; }
    catch(e){ toast('Google 金鑰無效或受網域限制，改用免費 OpenStreetMap'); }
  }
  return await searchOSM(query);
}
function renderSearchResults(results){
  const box=document.getElementById('cf-results'); if(!box) return;
  if(!results || !results.length){
    box.innerHTML='<div style="padding:8px;font-size:13px;color:var(--muted)">查無結果。免費圖資對「景點/地標/市場」較完整，個別餐廳/咖啡較少 — 可試韓文店名、或填 Google 金鑰（上方⚙️）查更全，或直接用下方欄位手動填寫。</div>';
    return;
  }
  box.innerHTML = results.map((r,i)=>`<div class="pick-item" onclick="useResult(${i})">
      <div style="flex:1;min-width:0">
        <div class="pi-name">${escapeHtml(r.name)} <span class="chip chip-sub">${CATS[r.cat]?CATS[r.cat].label:''}</span></div>
        <div style="font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.address)}</div>
        <div style="font-size:11px;color:var(--muted)">📍 ${AREAS[r.area]||'釜山'} · ${r.provider}${r.rating?(' · ⭐'+r.rating):''}${r.priceLevel!=null?(' · '+'＄'.repeat(Math.max(1,r.priceLevel))):''}</div>
      </div>
      <span class="pi-go">選用 →</span>
    </div>`).join('');
}
window.doSearch = async function(){
  const inp=document.getElementById('cf-search'); const q=(inp.value||'').trim();
  if(!q){ toast('輸入店名或關鍵字'); return; }
  const btn=document.getElementById('cf-searchbtn'); const box=document.getElementById('cf-results');
  btn.disabled=true; const old=btn.textContent; btn.textContent='搜尋中…';
  box.innerHTML='<div style="padding:10px;color:var(--muted);font-size:13px">⏳ 連線查詢中…</div>';
  try{ _searchResults=await searchPlaces(q); renderSearchResults(_searchResults); }
  catch(e){ box.innerHTML='<div style="padding:10px;color:var(--red);font-size:13px">查詢失敗（網路或瀏覽器限制）。可改用下方手動填寫，或點 Naver／Google 連結。</div>'; }
  finally{ btn.disabled=false; btn.textContent=old; }
};

/* ===================================================================
   規劃引擎：依預算層級 + 每日地理區域，自動排 5 天行程
   保證每天都有「午餐」與「晚餐」
   =================================================================== */
function planItinerary(poolIds, budget){
  const tier = tierOf(budget);
  const pool = [...new Set(poolIds)].map(getPlace).filter(Boolean);
  const used = new Set();
  const afc = {};  // autofill 計數：讓系統補上的國民美食每天輪替、不重複
  const dp = (p,part)=> p.daypart===part || p.daypart==='any';

  // 依「層級對價格的偏好」排序：精省偏便宜、奢華偏高檔
  const byScore = (a,b,areas)=>{
    const am = areas.includes(a.area)?1:0, bm = areas.includes(b.area)?1:0;
    if(am!==bm) return bm-am;
    if((b.star||3)!==(a.star||3)) return (b.star||3)-(a.star||3);
    return tier===3 ? (b.price||0)-(a.price||0) : (a.price||0)-(b.price||0);
  };

  // 選一個「需指定區域」的選項（景點/咖啡/購物）；找不到回 null
  function pickArea(wantFn, areas){
    const cands = pool.filter(p=>!used.has(p.id) && wantFn(p) && areas.includes(p.area));
    if(!cands.length) return null;
    cands.sort((a,b)=>byScore(a,b,areas));
    used.add(cands[0].id); return cands[0].id;
  }
  // 選餐（保證有結果）：先合餐別+未用，再放寬區域，最後用預設店
  function mealPick(mealType, areas){
    let cands = pool.filter(p=>p.cat==='food' && !used.has(p.id) && p.meal && p.meal.includes(mealType));
    if(!cands.length) cands = pool.filter(p=>p.cat==='food' && !used.has(p.id)); // 任何未用過的餐廳
    if(!cands.length){ // 池中餐廳已用盡 → 輪流注入預設國民美食，仍保證有午/晚餐
      const n = afc[mealType]||0; afc[mealType]=n+1;
      return {id:defaultEat(mealType, n), autofill:true};
    }
    cands.sort((a,b)=>byScore(a,b,areas));
    used.add(cands[0].id); return {id:cands[0].id};
  }
  // 早餐（近基地、不限區域，可略過）
  function pickBreakfast(areas){
    const cands = pool.filter(p=>!used.has(p.id) && p.cat==='food' && p.meal && p.meal.includes('breakfast'));
    if(!cands.length) return null;
    cands.sort((a,b)=>(areas.includes(b.area)?1:0)-(areas.includes(a.area)?1:0) || (b.star||3)-(a.star||3));
    used.add(cands[0].id); return cands[0].id;
  }
  // 住宿（同一家可連住多晚，不佔 used）
  function pickHotel(areasWanted, fallbackId, opts){
    opts = opts||{};
    let cands = pool.filter(p=>p.cat==='stay' && areasWanted.includes(p.area));
    if(opts.seaview){                                  // Day4 浪漫海景：優先挑「海景第一排」房型，而非最便宜
      const sv = cands.filter(p=>(p.sub||'').includes('海景'));
      if(sv.length) cands = sv;
    }
    if(!cands.length) cands = pool.filter(p=>p.cat==='stay');
    if(!cands.length) return fallbackId;
    cands.sort((a,b)=> tier===3 ? (b.price||0)-(a.price||0) : (a.price||0)-(b.price||0));
    return cands[0].id;
  }

  const hotelBase = pickHotel(['seomyeon'], 'kyungsung');
  // 精省層級全程住西面（海景改當天來回）；舒適/奢華 Day4 換海景第一排房
  const hotelSea = tier>=2 ? pickHotel(['gwangalli','haeundae'], 'guesswho', {seaview:true}) : hotelBase;

  const days = DAYS.map(day=>{
    const A = day.areas;
    const slots = [];
    const push=(key,label,time,id,autofill)=>{ if(id) slots.push({key,label,time,placeId:id,autofill:!!autofill}); };

    if(!day.arrival){ push('breakfast','早餐','08:30', pickBreakfast(A)); }
    push('am','上午行程','10:00', pickArea(p=>p.cat==='play'&&dp(p,'morning'), A));
    const l = mealPick('lunch', A);   push('lunch','午餐','12:30', l.id, l.autofill);
    push('pm','下午行程','14:00', pickArea(p=>p.cat==='play'&&dp(p,'afternoon'), A));
    push('pm2','下午行程','15:30', pickArea(p=>p.cat==='play'&&dp(p,'afternoon'), A));
    push('shop','購物','16:30', pickArea(p=>p.cat==='shop', A));
    push('cafe','咖啡/下午茶','17:15', pickArea(p=>p.cat==='cafe', A));
    const dn = mealPick('dinner', A); push('dinner','晚餐','18:30', dn.id, dn.autofill);
    if(!day.departure){ push('evening','夜間行程','20:00', pickArea(p=>p.cat==='play'&&dp(p,'evening'), A)); }

    // 依時間排序
    slots.sort((a,b)=>a.time.localeCompare(b.time));
    return {d:day.d, slots};
  });

  return {hotelBase, hotelSea, days, tier};
}

/* 取得某天的住宿 id */
function hotelOfDay(d){
  if(!state.itinerary) return null;
  if(d===5) return null;            // Day5 退房
  if(d===4) return state.itinerary.hotelSea;
  return state.itinerary.hotelBase;
}

/* ===================================================================
   預算計算
   =================================================================== */
function computeBudget(){
  const it = state.itinerary;
  let stay=0, food=0, play=0;
  // 住宿：Day1–3 基地 ×3 + Day4 海景 ×1
  const hb = getPlace(it.hotelBase), hs = getPlace(it.hotelSea);
  stay = (hb?hb.price:0)*3 + (hs?hs.price:0)*1;
  // 餐飲 + 景點娛樂：掃描所有時間軸
  it.days.forEach(day=>{
    day.slots.forEach(s=>{
      const p = getPlace(s.placeId); if(!p) return;
      if(p.cat==='food'||p.cat==='cafe') food += (p.price||0);
      else if(p.cat==='play') play += (p.price||0);
    });
  });
  const shop = +state.extras.shopping||0;
  const trans = +state.extras.transport||0;
  const reserve = +state.extras.reserve||0;
  const cats = [
    {key:'stay', name:'住宿（4 晚）', val:stay, color:'var(--c-stay)'},
    {key:'food', name:'餐飲（5 天）', val:food, color:'var(--c-food)'},
    {key:'play', name:'景點 + 娛樂', val:play, color:'var(--c-play)'},
    {key:'shop', name:'購物', val:shop, color:'var(--c-shop)'},
    {key:'trans', name:'市內+機場交通', val:trans, color:'var(--c-trans)'},
    {key:'reserve', name:'預備金', val:reserve, color:'var(--c-reserve)'},
  ];
  const total = cats.reduce((s,c)=>s+c.val,0);
  return {cats, total, stay, food, play, shop, trans, reserve};
}

/* 每日花費（含當晚住宿） */
function dailySpend(){
  const it = state.itinerary;
  return it.days.map(day=>{
    let v=0;
    day.slots.forEach(s=>{ const p=getPlace(s.placeId); if(p && p.cat!=='shop' && p.cat!=='stay') v+=(p.price||0); });
    const h = getPlace(hotelOfDay(day.d)); if(h) v+=h.price;
    return {d:day.d, val:v};
  });
}

    const pool = PLACES.filter(p=>p.tiers && p.tiers.includes(tier)).map(p=>p.id);

function defaultExtras(tier){
  if(tier===1) return {shopping:8000, transport:3000, reserve:3000};
  if(tier===3) return {shopping:25000, transport:4000, reserve:5000};
  return {shopping:17000, transport:3500, reserve:4000};
}

function extraInput(k,label){
  return `<div class="field" style="margin-bottom:8px">

/* 目標 vs 實際 */
function targetBoxHTML(b){
  const pct = Math.min(150, Math.round(b.total/state.budget*100));
  const diff = b.total - state.budget;
  let cls='ok', msg='';
  if(diff < -3000){ cls='under';
    msg=`比預算少 <b>${fmtNT(-diff)}</b>，還有加碼空間：海景房升等套房、韓牛改 1++、遊艇前排或包船。`; }
  else if(diff > 3000){ cls='over';
    msg=`超出預算 <b>${fmtNT(diff)}</b>，可省錢：帝王蟹改機張市場、海景改當天來回全程住西面、汗蒸幕用釜山 Pass、購物收斂。`; }
  else { cls='ok'; msg=`剛好落在預算甜蜜點，吃好住好、體驗到位 👍`; }
  const barColor = cls==='over'?'var(--red)':cls==='under'?'var(--green)':'var(--teal)';
  return `<div class="target-box">
    <div class="target-row"><span>實際估算</span><b style="color:${barColor}">${fmtNT(b.total)}</b></div>
    <div class="target-row"><span>你的目標</span><b>${fmtNT(state.budget)}</b></div>
    <div class="progress"><span style="width:${Math.min(100,pct)}%;background:${barColor}"></span></div>
    <div class="verdict ${cls}">${msg}</div>
  </div>`;
}

/* 圓環圖（純 SVG，無外部相依） */
function donutSVG(cats, total){
  const r=52, cx=66, cy=66, circ=2*Math.PI*r;
  let off=0;
  const segs = total>0 ? cats.filter(c=>c.val>0).map(c=>{
    const len = c.val/total*circ;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c.color}" stroke-width="22"
       stroke-dasharray="${len.toFixed(2)} ${(circ-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
       transform="rotate(-90 ${cx} ${cy})"></circle>`;
    off += len; return seg;
  }).join('') : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eee" stroke-width="22"></circle>`;
  return `<svg width="132" height="132" viewBox="0 0 132 132" style="flex-shrink:0">
    ${segs}
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="11" fill="#6b7280">總計</text>
    <text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="15" font-weight="800" fill="#1f3a5f">${fmtNT(total).replace('NT$','')}</text>
  </svg>`;
}

/* 每日長條圖 */
function dailyBarsHTML(){
  const ds = dailySpend();
  const max = Math.max(...ds.map(d=>d.val), 1);
  return ds.map(d=>`<div class="daily-bar">
    <span class="dlabel">Day ${d.d}</span>
    <div class="track"><div class="fill" style="width:${Math.max(3,d.val/max*100)}%"></div></div>
    <span class="dval">${fmtNT(d.val)}</span>
  </div>`).join('');
}

/* 單日卡片 */
function dayCardHTML(day){
  const meta = DAYS.find(x=>x.d===day.d);
  const hotel = getPlace(hotelOfDay(day.d));
  const ds = dailySpend().find(x=>x.d===day.d);
  // 檢查午/晚餐是否都在
  const hasLunch = day.slots.some(s=>s.key==='lunch');
  const hasDinner = day.slots.some(s=>s.key==='dinner');
  let warn='';
  if(!hasLunch || !hasDinner){
    const miss=[!hasLunch?'午餐':'',!hasDinner?'晚餐':''].filter(Boolean).join('、');
    warn = `<div class="day-warn">⚠️ 此日缺少 ${miss}（建議每天都要吃正餐）
      <button onclick="quickAddMeal(${day.d}, '${!hasLunch?'lunch':'dinner'}')">一鍵補上 →</button></div>`;
  }

  // 時間軸（進出標記 + 行程合併後，依時間排序，避免午餐排在抵達之前等錯亂）
  const rowItems = [];
  if(meta.arrival){
    rowItems.push({t:'12:00', html:markerRow('12:00','✈️ 中午抵達金海機場 → 西面飯店寄行李（輕軌+地鐵約 43 分 / 計程車）')});
  }
  if(meta.moveHotel && state.itinerary.hotelSea!==state.itinerary.hotelBase){
    rowItems.push({t:'09:00', html:markerRow('09:00','🧳 退房；行李寄放或請飯店／宅配送往海邊飯店，傍晚入住「'+(getPlace(state.itinerary.hotelSea)||{}).name+'」')});
  }
  day.slots.forEach(s=> rowItems.push({t:s.time, html:slotRow(day.d, s)}));
  if(meta.departure){
    rowItems.push({t:'21:00', html:markerRow('21:00','✈️ 晚餐後前往金海機場（以晚班機為例；預留退稅與報到時間。若搭早班機，請把當日行程往前壓縮）')});
  }
  rowItems.sort((a,b)=>a.t.localeCompare(b.t));
  const rows = rowItems.map(r=>r.html).join('');

  return `<div class="day-card">
    <div class="day-head">
      <div class="dnum">D${day.d}<small>DAY</small></div>
      <div>
        <div class="dtitle">${meta.title}</div>
        <div class="ddate">${meta.date}</div>
      </div>
      <div class="dspend">當日約 ${fmtNT(ds.val)}</div>
    </div>
    ${warn}
    <div class="timeline">${rows}</div>
    <div class="add-slot" onclick="openAddModal(${day.d})">＋ 在這天新增地點（可連網查詢後加入）</div>
    <div class="day-foot">
      ${hotel?`🏨 住宿：<b>${hotel.name}</b> <span style="color:var(--muted)">（${fmtNT(hotel.price)}/晚）</span>`
             :(day.d===5?'🧳 今日退房、結束行程':'🏨 住宿未定')}
      ${hotel?`<button class="btn btn-ghost btn-sm hbtn" onclick="changeHotel(${day.d})">更換住宿</button>`:''}
    </div>
  </div>`;
}

function markerRow(time,text){
  return `<div class="tl-marker"><div class="tl-time">${time}</div><div class="mk">${text}</div></div>`;
}

function slotRow(d, s){
  const p = getPlace(s.placeId);
  if(!p) return '';
  const icon = CATS[p.cat]?CATS[p.cat].emoji:'📍';
  const mealChips = p.meal ? p.meal.map(m=>`<span class="chip chip-meal">${({breakfast:'早',lunch:'午',dinner:'晚',snack:'宵'})[m]||m}</span>`).join('') : '';
  return `<div class="tl-item">
    <div class="tl-time">${s.time}</div>
    <div class="tl-icon">${icon}</div>
    <div class="tl-body">
      <div class="tl-slot">${s.label}</div>
      <div class="tl-name">${p.name} ${p.kr?`<span class="kr">${p.kr}</span>`:''}
        ${s.autofill?'<span class="autofill-tag">系統補上</span>':''}</div>
      <div class="tl-meta">
        <span class="chip chip-area">${AREAS[p.area]||p.area}</span>
        ${mealChips}
        ${p.price?`<span class="chip chip-price">${fmtNT(p.price)}</span>`:(p.cat==='play'?'<span class="chip chip-price">免費</span>':'')}

/* ---------- 行程編輯 ---------- */
window.removeSlot = function(d,key,placeId){
  const day = state.itinerary.days.find(x=>x.d===d);
  const i = day.slots.findIndex(s=>s.key===key && s.placeId===placeId);
  if(i>=0) day.slots.splice(i,1);
  save(); renderItinerary();
};
window.replan = function(){
  const tier = tierOf(state.budget);
  const pool = state.mode==='select' && state.selected.length
      ? state.selected
      : PLACES.filter(p=>p.tiers && p.tiers.includes(tier)).map(p=>p.id);
  state.itinerary = planItinerary(pool, state.budget);
  save(); renderItinerary(); toast('已重新規劃 🔄');
};
window.quickAddMeal = function(d, mealType){
  // 補上該日缺的餐：挑一個未排入、合餐別的店（優先當天區域）
  const day = state.itinerary.days.find(x=>x.d===d);
  const meta = DAYS.find(x=>x.d===d);
  const usedIds = new Set();
  state.itinerary.days.forEach(dd=>dd.slots.forEach(s=>usedIds.add(s.placeId)));
  let cands = allPlaces().filter(p=>p.cat==='food' && p.meal && p.meal.includes(mealType) && !usedIds.has(p.id));
  cands.sort((a,b)=>(meta.areas.includes(b.area)?1:0)-(meta.areas.includes(a.area)?1:0)||(b.star||3)-(a.star||3));
  const chosen = cands[0] ? cands[0].id : defaultEat(mealType, 0);
  const time = mealType==='lunch'?'12:30':'18:30';
  const label = mealType==='lunch'?'午餐':'晚餐';
  day.slots.push({key:mealType, label, time, placeId:chosen, autofill:!cands[0]});
  day.slots.sort((a,b)=>a.time.localeCompare(b.time));
  save(); renderItinerary(); toast('已補上'+label);
};

/* ---------- 在某天新增地點 ---------- */
window.openAddModal = function(d){
  const meta = DAYS.find(x=>x.d===d);
  const usedIds = new Set();
  state.itinerary.days.forEach(dd=>dd.slots.forEach(s=>usedIds.add(s.placeId)));
  // 候選：未排入的（咖啡/景點/美食/購物），當天區域優先排序
  const cands = allPlaces().filter(p=>p.cat!=='stay' && !usedIds.has(p.id));
  const groups = {food:'美食', cafe:'咖啡甜點', play:'景點娛樂', shop:'購物'};
  let body='';
  Object.keys(groups).forEach(cat=>{
    let items = cands.filter(p=>p.cat===cat);
    items.sort((a,b)=>(meta.areas.includes(b.area)?1:0)-(meta.areas.includes(a.area)?1:0)||(b.star||3)-(a.star||3));
    if(!items.length) return;
    body += `<div class="pick-group-h">${groups[cat]}</div>`;
    body += items.slice(0,18).map(p=>`<div class="pick-item" onclick="addSlotDo(${d},'${p.id}')">
      <div><div class="pi-name">${p.name}</div>
      <div style="font-size:12px;color:var(--muted)">${AREAS[p.area]}${p.price?(' · '+fmtNT(p.price)):''}${meta.areas.includes(p.area)?' · 📍同區順路':''}</div></div>
      <span class="pi-go">加入 →</span></div>`).join('');
  });
  openModal('＋ 在 Day '+d+'（'+meta.title+'）新增地點', `
    <div class="hint">📍 標記「同區順路」的最省交通。找不到想去的？最下面可「連網查詢後新增」。</div>
    <div class="pick-list">${body||'<div style="color:var(--muted)">沒有更多候選了，請用下方自訂新增。</div>'}</div>
    <div style="margin-top:14px"><button class="btn btn-teal btn-sm" onclick="openCustomModal('food', ${d})">🔍 連網查詢後新增自訂地點</button></div>
  `, d);
};
window.addSlotDo = function(d, id){
  const p = getPlace(id); if(!p) return;
  const day = state.itinerary.days.find(x=>x.d===d);
  // 依類別決定時段標籤與時間
  let key='extra', label='自由行程', time='15:00';
  if(p.cat==='food'){
    const hasLunch=day.slots.some(s=>s.key==='lunch'), hasDinner=day.slots.some(s=>s.key==='dinner');
    if(p.meal&&p.meal.includes('lunch')&&!hasLunch){ key='lunch';label='午餐';time='12:30'; }
    else if(p.meal&&p.meal.includes('dinner')&&!hasDinner){ key='dinner';label='晚餐';time='18:30'; }
    else if(p.meal&&p.meal.includes('breakfast')){ key='breakfast';label='早餐';time='08:30'; }
    else { key='snack';label='小吃/宵夜';time='21:00'; }
  } else if(p.cat==='cafe'){ key='cafe';label='咖啡/下午茶';time='16:45'; }
  else if(p.cat==='shop'){ key='shop2';label='購物';time='16:15'; }
  else if(p.cat==='play'){
    const dpart=p.daypart||'afternoon';
    if(dpart==='morning'){key='am2';label='上午行程';time='10:30';}
    else if(dpart==='evening'){key='ev2';label='夜間行程';time='20:15';}
    else {key='pm3';label='下午行程';time='14:45';}
  }
  day.slots.push({key:key+'-'+id, label, time, placeId:id});
  day.slots.sort((a,b)=>a.time.localeCompare(b.time));
  closeModal(); save(); renderItinerary(); toast('已加入 '+p.name);
};

  const id='custom-'+name.replace(/\s+/g,'')+'-'+state.customPlaces.length;
  const p={id, name:'⭐ '+name, kr:'', cat, sub:'自訂', area, price, star:4, note, tiers:[1,2,3], custom:true};
  if(cat==='food'){ p.meal=[document.getElementById('cf-meal').value]; }
  if(cat==='play'){ p.daypart='afternoon'; }
  if(cat==='cafe'){ p.daypart='afternoon'; }
  state.customPlaces.push(p);
  if(!state.selected.includes(id) && state.screen==='select') state.selected.push(id);
  save();
  closeModal();
  if(addToDay!==null && addToDay!==undefined && state.itinerary){ addSlotDo(addToDay, id); }
  else if(state.screen==='select'){ renderSelect(); toast('已加入「'+name+'」並勾選 ✅'); }
  else { renderItinerary(); toast('已新增「'+name+'」'); }
};

/* ===================================================================
   Modal / 重置
   =================================================================== */
function openModal(title, bodyHTML){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-h"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>
        <div class="modal-b">${bodyHTML}</div>
      </div>
    </div>`;
}
window.closeModal = function(){ document.getElementById('modalRoot').innerHTML=''; };

document.getElementById('navHome').addEventListener('click', ()=>go('home'));
document.getElementById('navReset').addEventListener('click', ()=>{
  if(confirm('確定要清除目前的規劃，重新開始嗎？')){
    const keepKey=state.apiKey;  // 保留已存的 Google 金鑰，免得每次重設都要重貼
    localStorage.removeItem(SKEY);
    state={mode:null, budget:70000, selected:[], itinerary:null, customPlaces:[], extras:{shopping:17000,transport:3500,reserve:4000}, screen:'home', apiKey:keepKey};
    save(); go('home');
  }
});

/* ===================================================================
   啟動
   =================================================================== */
load();
if(!state.screen) state.screen='home';
render();
</script>
